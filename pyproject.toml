[project]
name = "startpg"
dynamic = ["version"]
dependencies = [
  "flask",
  "yarl",
  "pyyaml",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts]
face = "face.face:main"
hiney = "hiney.hiney:main"
hands = "hands.hands:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false
