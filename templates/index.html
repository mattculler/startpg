<!doctype html>
<html>
  <head>
    <title>Local Services</title>
  </head>
  <body>
    {% for machine in machines %}
      <p>
        <span class="name">{{ machine["name"] }}</span>
        {% for endpoint in machine["endpoints"] %}
          <br>
          <a href="{{ endpoint["url"] }}" class="ip" target="_blank">{{ endpoint["url"] }}</a>
          <span class="endpoint_status">{{ endpoint["status"] }}</span>
        {% endfor %}
      </p>
    {% endfor %}
  </body>
</html>
